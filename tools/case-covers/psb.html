<!doctype html>
<!--
  Case cover for PSB-Bank Redesign concept, 1920×1080 (16:9) → public/assets/cases/psb-cover.webp.
  Render: open this file in a browser at a 1920×1080 viewport, take a screenshot and save it
  as WebP (quality ~88), e.g. Playwright page.screenshot() + any converter.
  Screens: frames from the "mockup for claude" section of the PSB Figma file, cropped to the
  first 874pt of each frame and exported at 2x (tools/case-covers/psb/*.png). The iPhone 17 Pro
  body is the hidden "bezel" layer from the same file (450×920pt, screen inset 24/23pt).
  Joke: cashback drops like loot in an MMORPG — floating "+₽" numbers, pixel coins and an item
  tooltip in the site's dark dialog style.
  Colours mirror src/styles/tokens/colors.css. The card zooms the cover on hover,
  so keep the key content away from the edges.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500&family=Handjet:wght@600;700&display=block"
    />
    <style>
      :root {
        --paper-3: #e8e1d2;
        --paper-2: #f7f3ea;
        --line-2: #cfc6b2;
        --ink-1: #29251e;
        --dialog: rgba(33, 30, 24, 0.94);
        --gold: #f2c14e;
        --gold-dark: #b7791f;
        --gold-light: #fbe39a;
        --psb: #f26a2e;
        --s: 4px; /* pixel corner step */
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--paper-3);
      }
      /* Pixel grid: 4px dots every 32px, like tiles on a game map; fades out toward the top */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: conic-gradient(from 270deg at 4px 4px, var(--line-2) 25%, transparent 0);
        background-size: 32px 32px;
        background-position: 14px 14px;
        mask-image: linear-gradient(to bottom, transparent 10%, #000 90%);
        opacity: 0.8;
      }
      /* Stepped corners, same shape as .px-clip on the site */
      .px {
        clip-path: polygon(
          0 calc(var(--s) * 2),
          var(--s) calc(var(--s) * 2),
          var(--s) var(--s),
          calc(var(--s) * 2) var(--s),
          calc(var(--s) * 2) 0,
          calc(100% - var(--s) * 2) 0,
          calc(100% - var(--s) * 2) var(--s),
          calc(100% - var(--s)) var(--s),
          calc(100% - var(--s)) calc(var(--s) * 2),
          100% calc(var(--s) * 2),
          100% calc(100% - var(--s) * 2),
          calc(100% - var(--s)) calc(100% - var(--s) * 2),
          calc(100% - var(--s)) calc(100% - var(--s)),
          calc(100% - var(--s) * 2) calc(100% - var(--s)),
          calc(100% - var(--s) * 2) 100%,
          calc(var(--s) * 2) 100%,
          calc(var(--s) * 2) calc(100% - var(--s)),
          var(--s) calc(100% - var(--s)),
          var(--s) calc(100% - var(--s) * 2),
          0 calc(100% - var(--s) * 2)
        );
      }

      /* Fan: every phone shares one pivot far below the frame */
      .phone {
        --k: 0.8; /* scale from Figma points */
        position: absolute;
        left: calc(960px - 225px * var(--k));
        top: 210px;
        width: calc(450px * var(--k));
        height: calc(920px * var(--k));
        transform-origin: 50% 2400px;
        transform: rotate(var(--a));
        filter: drop-shadow(0 24px 32px rgb(41 37 30 / 0.22));
      }
      .phone .screen {
        position: absolute;
        left: calc(24px * var(--k));
        top: calc(23px * var(--k));
        width: calc(402px * var(--k));
        height: calc(874px * var(--k));
        border-radius: calc(60px * var(--k));
        object-fit: cover;
        object-position: top;
      }
      .phone .body {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .p1 {
        --a: -18deg;
        z-index: 1;
      }
      .p2 {
        --a: -9deg;
        z-index: 2;
      }
      .p3 {
        --a: 0deg;
        z-index: 3;
      }
      .p4 {
        --a: 9deg;
        z-index: 2;
      }
      .p5 {
        --a: 18deg;
        z-index: 1;
      }

      /* Loot: floating numbers, like damage text over a game world */
      .float {
        position: absolute;
        z-index: 5;
        font:
          700 64px/1 'Handjet',
          monospace;
        letter-spacing: 0.02em;
        color: var(--psb);
        text-shadow: 4px 4px 0 var(--paper-2);
      }
      .float small {
        display: block;
        font-size: 30px;
        letter-spacing: 0.12em;
        color: var(--ink-1);
      }
      .coin {
        position: absolute;
        z-index: 5;
        width: 48px;
        height: 48px;
        filter: drop-shadow(4px 4px 0 rgb(41 37 30 / 0.18));
      }

      /* Item tooltip in the site's dialog style */
      .tooltip {
        position: absolute;
        z-index: 6;
        left: 1380px;
        top: 40px;
        width: 400px;
        padding: 24px 28px 26px;
        background: var(--dialog);
        color: var(--paper-2);
        font:
          400 22px/1.35 'Fira Sans',
          sans-serif;
      }
      .tooltip .name {
        font:
          700 40px/1 'Handjet',
          monospace;
        color: var(--psb);
      }
      .tooltip .rarity {
        margin-top: 6px;
        font:
          600 24px/1 'Handjet',
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #b9a6f2;
      }
      .tooltip ul {
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
      }
      .tooltip li + li {
        margin-top: 4px;
      }
      .tooltip .plus {
        color: #7fd99a;
      }
      .tooltip .flavor {
        margin-top: 14px;
        font-style: italic;
        color: #c9bfab;
      }
    </style>
  </head>
  <body>
    <div class="phone p1">
      <img class="screen" src="psb/account.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>
    <div class="phone p2">
      <img class="screen" src="psb/cb-off.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>
    <div class="phone p3">
      <img class="screen" src="psb/main.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>
    <div class="phone p4">
      <img class="screen" src="psb/cb-connect.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>
    <div class="phone p5">
      <img class="screen" src="psb/cb-on.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>

    <div class="float" style="left: 340px; top: 150px">+20 ₽</div>
    <div class="float" style="left: 196px; top: 270px; font-size: 48px">+165 ₽</div>
    <div class="float" style="left: 520px; top: 60px"><small>Крит!</small>+1 245</div>

    <svg class="coin" style="left: 470px; top: 170px" viewBox="0 0 8 8"><use href="#coin" /></svg>
    <svg class="coin" style="left: 300px; top: 236px; width: 32px; height: 32px" viewBox="0 0 8 8">
      <use href="#coin" />
    </svg>
    <svg class="coin" style="left: 690px; top: 70px; width: 36px; height: 36px" viewBox="0 0 8 8">
      <use href="#coin" />
    </svg>

    <div class="tooltip px">
      <div class="name">Кешбэк 7% · Деливери</div>
      <div class="rarity">Эпический предмет</div>
      <ul>
        <li><span class="plus">+7%</span> к покупкам с доставкой</li>
        <li><span class="plus">+1 балл</span> за каждый рубль</li>
        <li>Перезарядка: 1 месяц</li>
      </ul>
      <div class="flavor">«Курьер уже в пути»</div>
    </div>

    <svg width="0" height="0" style="position: absolute">
      <defs>
        <g id="coin" shape-rendering="crispEdges">
          <path
            fill="#b7791f"
            d="M2 0h4v1H2zM1 1h1v1H1zM6 1h1v1H6zM0 2h1v4H0zM7 2h1v4H7zM1 6h1v1H1zM6 6h1v1H6zM2 7h4v1H2z"
          />
          <path fill="#f2c14e" d="M2 1h4v1H2zM1 2h6v4H1zM2 6h4v1H2z" />
          <path fill="#fbe39a" d="M2 2h1v2H2zM3 1h1v1H3z" />
          <path fill="#b7791f" d="M4 3h1v2H4z" />
        </g>
      </defs>
    </svg>
  </body>
</html>

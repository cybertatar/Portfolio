<!doctype html>
<!--
  Case cover for BittVPN client, 1920×1080 (16:9) → public/assets/cases/bittvpn-cover.webp.
  Render: open this file in a browser at a 1920×1080 viewport, take a screenshot and save it
  as WebP (quality ~88), e.g. Playwright page.screenshot() + any converter.
  Idea: an airport departure board, but the "flights" are VPN locations. A small dark LED
  board sits on the same parchment as the PSB cover, letters are lit dots drawn from the
  5×7 glyphs in bittvpn/glyphs.js (the app's own dotted display face is Nothing Font, which
  we can't ship). Background: a faint tile pattern of dotted globes and planes.
  Screen: the main screen ("t-main") of the BittVPN Figma file, exported at 3x, cropped to
  the first 874pt, with the floating tab bar and home indicator from the end of the frame
  pasted over the bottom; saved at 2x (bittvpn/main.png). The iPhone 17 Pro body is shared
  with the PSB cover (iphone-17-pro.png, 450×920pt, screen inset 24/23pt).
  Board colours are the app's: background #0A0C0F, online green #72D769, warning amber #C59908.
  Parchment colours mirror src/styles/tokens/colors.css.
  The card zooms the cover on hover, so keep the key content away from the edges.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper-3: #e8e1d2;
        --line-2: #cfc6b2;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--paper-3);
      }
      /* Barely-there pattern of dotted globes and planes; same strength and fade as the
         coins on the PSB cover. The tile is drawn by the script below. */
      .pattern {
        position: absolute;
        inset: 0;
        background-size: 96px 96px;
        mask-image: linear-gradient(to bottom, rgb(0 0 0 / 0.35), #000 85%);
        opacity: 0.5;
      }
      .board {
        position: absolute;
        left: 224px;
        top: 382px;
        border-radius: 28px;
        box-shadow: 0 24px 48px rgb(41 37 30 / 0.22);
      }
      .phone {
        --k: 0.96; /* scale from Figma points */
        position: absolute;
        left: 1265px;
        top: 98px;
        width: calc(450px * var(--k));
        height: calc(920px * var(--k));
        filter: drop-shadow(0 24px 32px rgb(41 37 30 / 0.22));
      }
      .phone .screen {
        position: absolute;
        left: calc(24px * var(--k));
        top: calc(23px * var(--k));
        width: calc(402px * var(--k));
        height: calc(874px * var(--k));
        border-radius: calc(60px * var(--k));
      }
      .phone .body {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <script src="bittvpn/glyphs.js"></script>
  </head>
  <body>
    <div class="pattern"></div>
    <canvas class="board" id="board"></canvas>
    <div class="phone">
      <img class="screen" src="bittvpn/main.png" alt="" />
      <img class="body" src="iphone-17-pro.png" alt="" />
    </div>
    <script>
      // Pattern tile: 32×32 cells, a dotted globe and a dotted plane, one dot per cell.
      const TILE = [
        [5, 5, ['..###..', '.#.#.#.', '#..#..#', '#######', '#..#..#', '.#.#.#.', '..###..']],
        [20, 20, ['...#...', '...##..', '#..###.', '#######', '#..###.', '...##..', '...#...']],
      ];
      const circles = TILE.flatMap(([ox, oy, rows]) =>
        rows.flatMap((line, y) =>
          [...line].flatMap((c, x) =>
            c === '#' ? [`<circle cx='${ox + x + 0.5}' cy='${oy + y + 0.5}' r='0.42'/>`] : [],
          ),
        ),
      ).join('');
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='#cfc6b2'>${circles}</svg>`;
      document.querySelector('.pattern').style.backgroundImage =
        `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;

      // Board: three "flights", lit dots on an LED matrix.
      const P = 7; // dot pitch, px
      const R = 2.3; // dot radius, px
      const PAD = 6; // padding, in cells
      const INK = { white: '#f4f5f6', green: '#72d769', amber: '#c59908' };
      const flights = [
        ['DE', 'ГЕРМАНИЯ', 'ОНЛАЙН', INK.green],
        ['JP', 'ЯПОНИЯ', 'ДОСТУПНА', INK.white],
        ['LT', 'ЛИТВА', 'ТЕХРАБОТЫ', INK.amber],
      ];
      const colName = 6 * 3 + 3;
      const colStatus = colName + 6 * 9 + 3;
      const COLS = colStatus + 6 * 9 - 1 + PAD * 2;
      const ROWS = flights.length * 13 - 6 + PAD * 2;

      const lit = new Map();
      function text(str, col, row, ink) {
        [...str].forEach((ch, i) => {
          const g = GLYPHS[ch];
          if (!g) throw new Error('No glyph for ' + ch);
          g.forEach((line, y) =>
            [...line].forEach((cell, x) => {
              if (cell === '#') lit.set(`${col + i * 6 + x},${row + y}`, ink);
            }),
          );
        });
      }
      flights.forEach(([code, name, status, ink], i) => {
        const row = PAD + i * 13;
        text(code, PAD, row, INK.white);
        text(name, PAD + colName, row, INK.white);
        text(status, PAD + colStatus, row, ink);
      });

      const cv = document.getElementById('board');
      cv.width = COLS * P;
      cv.height = ROWS * P;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#0a0c0f';
      ctx.fillRect(0, 0, cv.width, cv.height);
      const at = (c) => c * P + P / 2;
      const dot = (x, y) => {
        ctx.beginPath();
        ctx.arc(x, y, R, 0, Math.PI * 2);
        ctx.fill();
      };
      ctx.fillStyle = 'rgb(255 255 255 / 0.06)';
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) if (!lit.has(`${c},${r}`)) dot(at(c), at(r));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const [key, ink] of lit) {
        const [c, r] = key.split(',').map(Number);
        const g = ctx.createRadialGradient(at(c), at(r), 0, at(c), at(r), P * 1.6);
        g.addColorStop(0, ink + '2c');
        g.addColorStop(1, ink + '00');
        ctx.fillStyle = g;
        ctx.fillRect(at(c) - P * 1.6, at(r) - P * 1.6, P * 3.2, P * 3.2);
      }
      ctx.restore();
      for (const [key, ink] of lit) {
        const [c, r] = key.split(',').map(Number);
        ctx.fillStyle = ink;
        dot(at(c), at(r));
      }
      // Centre the board vertically on the phone.
      cv.style.top = `${540 - cv.height / 2}px`;
    </script>
  </body>
</html>

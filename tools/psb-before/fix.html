<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Roboto:wght@400&display=swap"
    />
  </head>
  <body style="margin: 0; background: #888">
    <!-- Loads both fonts before drawing --><span style="font-family: Inter; font-weight: 600"
      >9:41</span
    ><span style="font-family: Roboto">ab</span>
    <script>
      const W = 590,
        H = 1280,
        BAR = 70;
      // Android screens: status bar rows 0..43, nav bar from 1239
      const ANDROID = [3, 4, 5, 6, 8, 9, 10];
      const load = (src) =>
        new Promise((r) => {
          const i = new Image();
          i.onload = () => r(i);
          i.src = src;
        });
      const lum = ([r, g, b]) => 0.299 * r + 0.587 * g + 0.114 * b;

      function statusBar(ctx, light) {
        const c = light ? '#fff' : '#000';
        ctx.fillStyle = c;
        ctx.strokeStyle = c;
        ctx.font = '600 25px Inter';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('9:41', 95, 47);
        // signal: four bars
        const bx = 418,
          by = 56;
        [6, 9, 12, 15].forEach((h, i) => {
          ctx.beginPath();
          ctx.roundRect(bx + i * 7, by - h, 5, h, 1.5);
          ctx.fill();
        });
        // wifi: three arcs and a dot
        const wx = 467,
          wy = 58;
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        [16, 10.5].forEach((r) => {
          ctx.beginPath();
          ctx.arc(wx, wy, r, -Math.PI * 0.75, -Math.PI * 0.25);
          ctx.stroke();
        });
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.arc(wx, wy, 5.5, -Math.PI * 0.75, -Math.PI * 0.25);
        ctx.closePath();
        ctx.fill();
        // battery
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        ctx.roundRect(492, 40, 37, 18, 5);
        ctx.stroke();
        ctx.beginPath();
        ctx.roundRect(531, 45, 3, 8, 1.5);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.roundRect(495, 43, 31, 12, 3);
        ctx.fill();
      }
      function homeBar(ctx, light) {
        ctx.fillStyle = light ? '#fff' : '#000';
        ctx.beginPath();
        ctx.roundRect(W / 2 - 98, H - 19, 196, 7, 3.5);
        ctx.fill();
      }
      const px = (img, x, y) => {
        const c = document.createElement('canvas');
        c.width = 1;
        c.height = 1;
        const k = c.getContext('2d');
        k.drawImage(img, x, y, 1, 1, 0, 0, 1, 1);
        return [...k.getImageData(0, 0, 1, 1).data];
      };
      // Replaces annotation red (the scenario's highlight boxes) with the nearest non-red pixel in the row
      function unRed(ctx, y0, y1) {
        const d = ctx.getImageData(0, y0, W, y1 - y0);
        const a = d.data;
        const red = (i) => a[i] > 170 && a[i + 1] < 110 && a[i + 2] < 110;
        const mask = new Uint8Array(W * (y1 - y0));
        for (let y = 0; y < y1 - y0; y++)
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            if (red(i))
              for (let dy = -1; dy <= 1; dy++)
                for (let dx = -1; dx <= 1; dx++) {
                  const yy = y + dy,
                    xx = x + dx;
                  if (yy >= 0 && yy < y1 - y0 && xx >= 0 && xx < W) mask[yy * W + xx] = 1;
                }
          }
        for (let y = 0; y < y1 - y0; y++)
          for (let x = 0; x < W; x++) {
            if (!mask[y * W + x]) continue;
            for (let r = 1; r < 12; r++) {
              const cands = [
                [x - r, y],
                [x + r, y],
                [x, y - r],
                [x, y + r],
              ].filter(
                ([xx, yy]) => xx >= 0 && xx < W && yy >= 0 && yy < y1 - y0 && !mask[yy * W + xx],
              );
              if (cands.length) {
                const [xx, yy] = cands[0];
                const j = (yy * W + xx) * 4,
                  i = (y * W + x) * 4;
                a[i] = a[j];
                a[i + 1] = a[j + 1];
                a[i + 2] = a[j + 2];
                a[i + 3] = 255;
                break;
              }
            }
          }
        ctx.putImageData(d, 0, y0);
      }

      window.fixAll = async () => {
        const out = {};
        for (let n = 1; n <= 10; n++) {
          const img = await load(`src/s${String(n).padStart(2, '0')}.png`);
          const c = document.createElement('canvas');
          c.width = W;
          c.height = H;
          const ctx = c.getContext('2d');
          let top;
          if (ANDROID.includes(n)) {
            top = px(img, 6, 50);
            ctx.fillStyle = `rgb(${top})`;
            ctx.fillRect(0, 0, W, H);
            ctx.drawImage(img, 0, 44, W, 1195, 0, BAR, W, 1195);
            ctx.fillStyle = `rgb(${px(img, 40, 1236)})`;
            ctx.fillRect(0, BAR + 1195, W, H - BAR - 1195);
          } else {
            top = px(img, 40, 70);
            ctx.fillStyle = `rgb(${top})`;
            ctx.fillRect(0, 0, W, H);
            ctx.drawImage(img, 0, 0);
            ctx.fillStyle = `rgb(${top})`;
            ctx.fillRect(0, 0, W, 64);
          }
          // Rounded corners of the Figma frame left transparent pixels: fill them with the edge colour
          const light = lum(top) < 128;
          statusBar(ctx, light);
          const bottom = px(c, 40, H - 16);
          homeBar(ctx, lum(bottom) < 150);
          if (n === 1) unRed(ctx, 440, 900);
          // Made-up address instead of the scribbled-out one
          if (n === 4) {
            const y = BAR - 44;
            ctx.fillStyle = `rgb(${px(c, 540, 200 + y)})`;
            ctx.fillRect(28, 178 + y, 450, 42);
            ctx.fillStyle = '#212121';
            ctx.font = '400 21px Roboto';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('ivan.petrov@mail.ru', 30, 210 + y);
            const w = ctx.measureText('ivan.petrov@mail.ru').width;
            ctx.fillStyle = '#f26b2b';
            ctx.fillRect(32 + w, 189 + y, 2, 26);
          }
          if (n === 5 || n === 6) {
            const y = BAR - 44 + (n === 6 ? 140 : 0);
            ctx.fillStyle = `rgb(${px(c, 4, 160 + y)})`;
            ctx.fillRect(226, 146 + y, 320, 40);
            ctx.fillStyle = '#fff';
            ctx.font = '400 20.5px Roboto';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('ivan.petrov@mail', 230, 174 + y);
          }
          out[n] = c.toDataURL('image/webp', 0.86);
        }
        return out;
      };
    </script>
  </body>
</html>

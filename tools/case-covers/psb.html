<!doctype html>
<!--
  Case cover for PSB-Bank Redesign concept, 1920×1080 (16:9) → public/assets/cases/psb-cover.webp.
  Render: open this file in a browser at a 1920×1080 viewport, take a screenshot and save it
  as WebP (quality ~88), e.g. Playwright page.screenshot() + any converter.
  Screens: frames from the "mockup for claude" section of the PSB Figma file, cropped to the
  first 874pt of each frame and exported at 2x (tools/case-covers/psb/*.png). The iPhone 17 Pro
  body is the hidden "bezel" layer from the same file (450×920pt, screen inset 24/23pt).
  Easter egg: the site's gauntlet cursor (src/assets/cursors) taps the QR button on the main screen.
  Colours mirror src/styles/tokens/colors.css. The card zooms the cover on hover,
  so keep the key content away from the edges.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper-3: #e8e1d2;
        --line-2: #cfc6b2;
        --ink-1: #29251e;
        --s: 4px; /* pixel corner step */
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--paper-3);
      }
      /* Pixel grid: 4px dots every 32px, like tiles on a game map; fades out toward the top */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: conic-gradient(from 270deg at 4px 4px, var(--line-2) 25%, transparent 0);
        background-size: 32px 32px;
        background-position: 14px 14px;
        mask-image: linear-gradient(to bottom, transparent 10%, #000 90%);
        opacity: 0.8;
      }
      /* Stepped corners, same shape as .px-clip on the site */
      .px {
        clip-path: polygon(
          0 calc(var(--s) * 2),
          var(--s) calc(var(--s) * 2),
          var(--s) var(--s),
          calc(var(--s) * 2) var(--s),
          calc(var(--s) * 2) 0,
          calc(100% - var(--s) * 2) 0,
          calc(100% - var(--s) * 2) var(--s),
          calc(100% - var(--s)) var(--s),
          calc(100% - var(--s)) calc(var(--s) * 2),
          100% calc(var(--s) * 2),
          100% calc(100% - var(--s) * 2),
          calc(100% - var(--s)) calc(100% - var(--s) * 2),
          calc(100% - var(--s)) calc(100% - var(--s)),
          calc(100% - var(--s) * 2) calc(100% - var(--s)),
          calc(100% - var(--s) * 2) 100%,
          calc(var(--s) * 2) 100%,
          calc(var(--s) * 2) calc(100% - var(--s)),
          var(--s) calc(100% - var(--s)),
          var(--s) calc(100% - var(--s) * 2),
          0 calc(100% - var(--s) * 2)
        );
      }

      /* Fan: every phone shares one pivot far below the frame */
      .phone {
        --k: 0.8; /* scale from Figma points */
        position: absolute;
        left: calc(960px - 225px * var(--k));
        top: 150px;
        width: calc(450px * var(--k));
        height: calc(920px * var(--k));
        transform-origin: 50% 2400px;
        transform: rotate(var(--a));
        filter: drop-shadow(0 24px 32px rgb(41 37 30 / 0.22));
      }
      .phone .screen {
        position: absolute;
        left: calc(24px * var(--k));
        top: calc(23px * var(--k));
        width: calc(402px * var(--k));
        height: calc(874px * var(--k));
        border-radius: calc(60px * var(--k));
        object-fit: cover;
        object-position: top;
      }
      .phone .body {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .p1 {
        --a: -18deg;
        z-index: 1;
      }
      .p2 {
        --a: -9deg;
        z-index: 2;
      }
      .p3 {
        --a: 0deg;
        z-index: 3;
      }
      .p4 {
        --a: 9deg;
        z-index: 2;
      }
      .p5 {
        --a: 18deg;
        z-index: 1;
      }

      /* Easter egg: the site's gauntlet cursor taps the QR button on the main screen */
      .tap {
        position: absolute;
        z-index: 5;
        left: 831px;
        top: 596px;
        width: 64px;
        height: 64px;
        image-rendering: pixelated;
        filter: drop-shadow(2px 2px 0 rgb(0 0 0 / 0.35));
      }
      .spark {
        position: absolute;
        z-index: 5;
        left: 827px;
        top: 556px;
        width: 48px;
        height: 32px;
      }
    </style>
  </head>
  <body>
    <div class="phone p1">
      <img class="screen" src="psb/account.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>
    <div class="phone p2">
      <img class="screen" src="psb/cb-off.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>
    <div class="phone p3">
      <img class="screen" src="psb/main.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>
    <div class="phone p4">
      <img class="screen" src="psb/cb-connect.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>
    <div class="phone p5">
      <img class="screen" src="psb/cb-on.png" alt="" />
      <img class="body" src="psb/iphone-17-pro.png" alt="" />
    </div>

    <!-- Click spark: three pixel strokes above the fingertip -->
    <svg class="spark" viewBox="0 0 12 8" shape-rendering="crispEdges" aria-hidden="true">
      <path fill="#f7f3ea" d="M1 3h1v1H1zM2 4h1v1H2zM5 0h1v3H5zM9 4h1v1H9zM10 3h1v1h-1z" />
    </svg>
    <img class="tap" src="psb/gauntlet.png" alt="" />
  </body>
</html>

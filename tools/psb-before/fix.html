<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Roboto:wght@400&display=swap"
    />
  </head>
  <body style="margin: 0; background: #888">
    <!-- Loads both fonts before drawing --><span style="font-family: Inter; font-weight: 600"
      >9:41</span
    ><span style="font-family: Roboto">ab</span>
    <script src="bars.js"></script>
    <script>
      // Android screens: status bar rows 0..43, nav bar from 1239
      const ANDROID = [3, 4, 5, 6, 8, 9, 10];
      // Android screens whose full-width button sat on the nav bar
      const LIFTED = [5, 6, 9, 10];
      const SAFE = 48;
      window.fixAll = async () => {
        const out = {};
        for (let n = 1; n <= 10; n++) {
          const img = await load(`src/s${String(n).padStart(2, '0')}.png`);
          const c = document.createElement('canvas');
          c.width = W;
          c.height = H;
          const ctx = c.getContext('2d');
          let top;
          if (ANDROID.includes(n)) {
            top = px(img, 6, 50);
            ctx.fillStyle = `rgb(${top})`;
            ctx.fillRect(0, 0, W, H);
            if (LIFTED.includes(n)) {
              // A full-width button at the bottom: lift it above the home indicator like an
              // iOS safe area, taking the room out of the screen's longest empty stretch
              const cut = BAR + 1195 + SAFE - H;
              const [from, to] = emptyRun(img, 44, 1239);
              const at = Math.round((from + to) / 2 - cut / 2);
              ctx.drawImage(img, 0, 44, W, at - 44, 0, BAR, W, at - 44);
              const rest = 1239 - (at + cut);
              ctx.drawImage(img, 0, at + cut, W, rest, 0, BAR + at - 44, W, rest);
              ctx.fillStyle = `rgb(${px(img, 6, from + 4)})`;
              ctx.fillRect(0, H - SAFE, W, SAFE);
            } else {
              ctx.drawImage(img, 0, 44, W, 1195, 0, BAR, W, 1195);
              ctx.fillStyle = `rgb(${px(img, 40, 1236)})`;
              ctx.fillRect(0, BAR + 1195, W, H - BAR - 1195);
            }
          } else {
            top = px(img, 40, 70);
            ctx.fillStyle = `rgb(${top})`;
            ctx.fillRect(0, 0, W, H);
            ctx.drawImage(img, 0, 0);
            ctx.fillStyle = `rgb(${top})`;
            ctx.fillRect(0, 0, W, 64);
          }
          // Rounded corners of the Figma frame left transparent pixels: fill them with the edge colour
          const light = lum(top) < 128;
          statusBar(ctx, light);
          const bottom = px(c, 40, H - 16);
          homeBar(ctx, lum(bottom) < 150);
          if (n === 1) unRed(ctx, 440, 900);
          // Made-up address instead of the scribbled-out one
          if (n === 4) {
            const y = BAR - 44;
            ctx.fillStyle = `rgb(${px(c, 540, 200 + y)})`;
            ctx.fillRect(28, 178 + y, 450, 42);
            ctx.fillStyle = '#212121';
            ctx.font = '400 21px Roboto';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('ivan.petrov@mail.ru', 30, 210 + y);
            const w = ctx.measureText('ivan.petrov@mail.ru').width;
            ctx.fillStyle = '#f26b2b';
            ctx.fillRect(32 + w, 189 + y, 2, 26);
          }
          if (n === 5 || n === 6) {
            const y = BAR - 44 + (n === 6 ? 140 : 0);
            ctx.fillStyle = `rgb(${px(c, 4, 160 + y)})`;
            ctx.fillRect(226, 146 + y, 320, 40);
            ctx.fillStyle = '#fff';
            ctx.font = '400 20.5px Roboto';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('ivan.petrov@mail', 230, 174 + y);
          }
          out[n] = c.toDataURL('image/webp', 0.86);
        }
        return out;
      };
    </script>
  </body>
</html>

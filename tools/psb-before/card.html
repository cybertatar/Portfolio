<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    />
  </head>
  <body style="margin: 0; background: #888">
    <!-- Loads the font before drawing --><span style="font-family: Inter; font-weight: 600"
      >9:41</span
    ><span style="font-family: Inter">2200</span>
    <script src="bars.js"></script>
    <script>
      // Card data flow: iPhone screenshots already, only the bars and the annotations change
      window.fixAll = async () => {
        const out = {};
        for (let n = 1; n <= 10; n++) {
          const img = await load(`card/s${String(n).padStart(2, '0')}.png`);
          const c = document.createElement('canvas');
          c.width = W;
          c.height = H;
          const ctx = c.getContext('2d');
          const top = px(img, 300, 12);
          ctx.fillStyle = `rgb(${top})`;
          ctx.fillRect(0, 0, W, H);
          ctx.drawImage(img, 0, 0);
          // The recorded status bar (other times, a greyed-out one under a sheet) gives way to 9:41
          ctx.fillStyle = `rgb(${top})`;
          ctx.fillRect(0, 0, W, 64);
          statusBar(ctx, lum(top) < 128);
          // Rounded corners of the Figma frame: fill the bottom ones with the edge colour
          const bottom = px(img, 40, H - 16);
          ctx.fillStyle = `rgb(${bottom})`;
          ctx.fillRect(0, H - 44, 44, 44);
          ctx.fillRect(W - 44, H - 44, 44, 44);
          ctx.drawImage(img, 44, H - 44, W - 88, 44, 44, H - 44, W - 88, 44);
          homeBar(ctx, lum(bottom) < 150);
          if (n === 1) unRed(ctx, 520, 830);
          // A made-up number instead of the scribbled-out one, in the field's own type
          if (n === 6 || n === 7) {
            ctx.fillStyle = `rgb(${px(img, 300, 170)})`;
            ctx.fillRect(26, 203, 340, 46);
            // the scribble's tail, right of the label and left of the field
            ctx.fillRect(180, 196, 186, 8);
            ctx.fillStyle = `rgb(${px(img, 10, 300)})`;
            ctx.fillRect(12, 203, 13, 46);
            ctx.fillStyle = '#1c1c1e';
            ctx.font = '400 24.5px Inter';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('2200 0315 8326 7044', 48, 229);
          }
          out[n] = c.toDataURL('image/webp', 0.86);
        }
        return out;
      };
    </script>
  </body>
</html>
